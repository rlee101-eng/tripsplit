name: Keep Supabase awake

# Supabase pauses free projects after about a week with no activity.
# Calling the database every three days keeps it running.
on:
  schedule:
    - cron: '17 20 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call keepalive()
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          curl --fail-with-body --silent --show-error --retry 3 \
            -X POST "${URL%/}/rest/v1/rpc/keepalive" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
